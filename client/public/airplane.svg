<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 60" width="140" height="60">
  <defs>
    <!-- Lacquer red gradient for fuselage -->
    <linearGradient id="fuselageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3355" />
      <stop offset="45%" stop-color="#e11d48" />
      <stop offset="85%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- Top highlight reflection -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Cockpit Canopy Glass Gradient -->
    <linearGradient id="cockpitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="35%" stop-color="#7dd3fc" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Propeller Spinner Cone Gradient -->
    <linearGradient id="spinnerGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- Propeller Motion Blur Disc -->
    <linearGradient id="propBlur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.8)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.1)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.8)" />
    </linearGradient>

    <!-- Flame Afterburner Gradient -->
    <linearGradient id="flameGrad" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="planeGlow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-1" dy="3" stdDeviation="4" flood-color="#e11d48" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Exhaust Flame Pulse (Behind Engine) -->
  <path d="M 50 33 C 35 34, 20 36, 12 34 C 20 32, 35 31, 50 32 Z" fill="url(#flameGrad)" />

  <g filter="url(#planeGlow)">
    <!-- Horizontal Tail Stabilizer (Behind fuselage) -->
    <path d="M 18 28 L 6 23 C 3 21, 6 19, 10 20 L 26 26 Z" fill="#9f1239" />

    <!-- Main Far Wing (Behind fuselage) -->
    <path d="M 68 24 L 54 8 C 52 5, 57 4, 62 5 L 82 22 Z" fill="#9f1239" />
    <path d="M 54 8 L 57 5 L 61 6 L 58 9 Z" fill="#ffffff" />

    <!-- Aircraft Fuselage Main Body -->
    <!-- Starts at nose spinner (108, 30), curves down belly to tail (12, 30), curves back up over spine to nose -->
    <path d="
      M 108 30
      C 108 35, 95 42, 70 43
      C 45 44, 25 36, 10 32
      C 6 31, 6 29, 10 28
      C 22 25, 45 22, 65 21
      C 80 20, 102 24, 108 30
      Z"
      fill="url(#fuselageGrad)"
      stroke="#4c0519"
      stroke-width="1.5"
    />

    <!-- Fuselage Top Specular Gloss Highlight -->
    <path d="
      M 102 28
      C 95 24, 80 22, 65 22
      C 48 22, 30 25, 20 28
      C 30 26, 50 24, 65 24
      C 80 24, 95 26, 102 28
      Z"
      fill="url(#highlightGrad)"
    />

    <!-- Vertical Tail Fin (Rudder) with White Trim -->
    <path d="M 22 28 L 8 8 C 6 5, 11 4, 15 5 L 34 26 Z" fill="#be123c" stroke="#4c0519" stroke-width="1.2" />
    <path d="M 8 8 L 11 5 L 15 6 L 12 9 Z" fill="#ffffff" />
    <path d="M 14 11 L 18 7 L 22 8 L 18 12 Z" fill="#facc15" />

    <!-- Bubble Cockpit Windshield -->
    <path d="
      M 82 23
      C 76 14, 62 14, 52 23
      C 60 21, 74 21, 82 23
      Z"
      fill="url(#cockpitGrad)"
      stroke="#1e293b"
      stroke-width="1.2"
    />

    <!-- Windshield Reflection Glare -->
    <path d="
      M 78 21
      C 74 16, 66 16, 60 21
      C 64 19, 72 19, 78 21
      Z"
      fill="#ffffff"
      opacity="0.75"
    />

    <!-- Exhaust Pipes Manifold -->
    <rect x="76" y="29" width="6" height="3" rx="1.5" fill="#1e293b" />
    <rect x="84" y="29" width="6" height="3" rx="1.5" fill="#1e293b" />
    <rect x="92" y="29" width="6" height="3" rx="1.5" fill="#1e293b" />

    <!-- Near Wing (In front of fuselage) -->
    <path d="
      M 75 29
      L 46 48
      C 42 51, 48 53, 54 51
      L 90 32
      Z"
      fill="#e11d48"
      stroke="#4c0519"
      stroke-width="1.2"
    />

    <!-- Wingtip Racing Stripes (White & Yellow) -->
    <path d="M 46 48 L 50 45 L 56 47 L 52 50 Z" fill="#ffffff" />
    <path d="M 52 44 L 56 41 L 62 43 L 58 46 Z" fill="#facc15" />

    <!-- Propeller Hub Spinner Nosecone -->
    <path d="
      M 106 25
      C 114 25, 118 29, 118 30
      C 118 31, 114 35, 106 35
      Z"
      fill="url(#spinnerGrad)"
      stroke="#78350f"
      stroke-width="1"
    />

    <!-- Spinning Propeller Blades Motion Blur -->
    <ellipse cx="114" cy="30" rx="3" ry="26" fill="url(#propBlur)" opacity="0.85" />
    <ellipse cx="114" cy="30" rx="1.5" ry="24" fill="#ffffff" opacity="0.6" />
  </g>
</svg>
